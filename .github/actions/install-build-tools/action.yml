name: Install build tools
description: Install the pinned toolchain and native Tauri/xcap build dependencies.

inputs:
  cache:
    description: Restore the mise tool cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libayatana-appindicator3-dev \
          libclang-dev \
          libdbus-1-dev \
          libegl-dev \
          libgbm-dev \
          libgtk-3-dev \
          libpipewire-0.3-dev \
          librsvg2-dev \
          libwayland-dev \
          libwebkit2gtk-4.1-dev \
          libxdo-dev \
          libxrandr-dev \
          pkg-config
    - name: Install tools
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        cache: ${{ inputs.cache }}
    - name: Prepare fixture frontend
      shell: bash
      run: |
        mkdir -p examples/svelte-tauri/dist
        touch examples/svelte-tauri/dist/index.html

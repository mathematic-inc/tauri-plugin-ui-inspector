name: Setup build
description: Install the pinned toolchain and native Tauri/xcap build dependencies.

inputs:
  cache:
    description: Restore the Cargo cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libayatana-appindicator3-dev \
          libclang-dev \
          libdbus-1-dev \
          libegl-dev \
          libgbm-dev \
          libgtk-3-dev \
          libpipewire-0.3-dev \
          librsvg2-dev \
          libwayland-dev \
          libwebkit2gtk-4.1-dev \
          libxdo-dev \
          libxrandr-dev \
          pkg-config
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        cache: ${{ inputs.cache }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      if: inputs.cache == 'true'
      with:
        cache-on-failure: true
    - name: Prepare fixture frontend
      shell: bash
      run: |
        mkdir -p examples/svelte-tauri/dist
        touch examples/svelte-tauri/dist/index.html

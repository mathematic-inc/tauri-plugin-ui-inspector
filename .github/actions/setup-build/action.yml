name: Setup build
description: Install the pinned toolchain and native Tauri/xcap build dependencies.

inputs:
  cache:
    description: Restore the Cargo cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libayatana-appindicator3-dev \
          libclang-dev \
          libdbus-1-dev \
          libegl-dev \
          libgbm-dev \
          libgtk-3-dev \
          libpipewire-0.3-dev \
          librsvg2-dev \
          libwayland-dev \
          libwebkit2gtk-4.1-dev \
          libxdo-dev \
          libxrandr-dev \
          pkg-config
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        cache: ${{ inputs.cache }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      if: inputs.cache == 'true'
      with:
        cache-on-failure: true
    - name: Prepare fixture frontend
      shell: bash
      run: |
        mkdir -p examples/svelte-tauri/dist
        touch examples/svelte-tauri/dist/index.html

version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    groups:
      # The runtime and native test webdriver share Windows WebView types.
      tauri:
        patterns:
          - "tauri"
          - "tauri-plugin-wdio-webdriver"
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

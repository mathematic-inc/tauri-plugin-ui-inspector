name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  basics:
    name: Basics
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Run fast checks
        run: hk check --all

  checks:
    name: Full checks
    if: github.event_name != 'schedule'
    needs: basics
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - run: pnpm install --frozen-lockfile
      - name: Run every check
        run: hk check --all --slow

  node-floor:
    name: Node ${{ matrix.node }} toolchain floor
    if: github.event_name != 'schedule'
    needs: basics
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.2, 24.15.0]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm --filter './packages/*' build

  audit:
    name: Dependency audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
      - run: mise install rust aqua:EmbarkStudios/cargo-deny
      - run: mise exec -- cargo-deny --locked --workspace check advisories

  test:
    name: Test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    needs: basics
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - run: cargo test --locked --workspace --all-features

  package:
    name: Package artifacts
    if: github.event_name != 'schedule'
    needs: basics
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - run: pnpm install --frozen-lockfile
      - name: Package crates
        run: |
          cargo package --locked -p tauri-ui-inspector-core
          # These depend on the core crate at the same version. Until that
          # version reaches crates.io, Cargo can validate contents but cannot
          # assemble a publishable dependency graph.
          cargo package --list -p tauri-plugin-ui-inspector
          cargo package --list -p tauri-ui-inspector
      - name: Package npm workspaces
        run: |
          pnpm --filter './packages/*' build
          mkdir -p artifacts
          pnpm --filter './packages/*' pack --pack-destination "$PWD/artifacts"

  msrv:
    name: Rust 1.97.0
    if: github.event_name != 'schedule'
    needs: basics
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.0"
      - name: Check minimum supported Rust version
        run: rustup run 1.97.0 cargo check --locked --workspace

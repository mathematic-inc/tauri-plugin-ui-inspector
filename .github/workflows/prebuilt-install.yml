name: Verify published installations

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  MANIFEST: crates/ui-inspector/Cargo.toml
  CARGO_PACKAGE: tauri-ui-inspector
  BINARY_NAME: ui-inspector
  RELEASE_PREFIX: v

jobs:
  install:
    permissions:
      contents: read
    name: Install without compiling ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: cargo-binstall
          cache: false
      - name: Install published binaries through binstall and mise
        env:
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(awk -F'"' '/^version = / { print $2; exit }' "$MANIFEST")"
          test -n "$version"
          binary="$BINARY_NAME"
          archive="$CARGO_PACKAGE-$version-$TARGET.tar.gz"
          if [[ "$TARGET" == *windows* ]]; then
            binary="$binary.exe"
            archive="$CARGO_PACKAGE-$version-$TARGET.zip"
          fi
          cargo-binstall "$CARGO_PACKAGE@$version" --no-confirm --disable-telemetry \
            --disable-strategies compile,quick-install --targets "$TARGET" \
            --install-path "$RUNNER_TEMP/binstall" --no-track
          mise install-into \
            "github:${GITHUB_REPOSITORY}[asset_pattern=${archive}]@${RELEASE_PREFIX}${version}" \
            "$RUNNER_TEMP/mise"
          for prefix in "$RUNNER_TEMP/binstall" "$RUNNER_TEMP/mise"; do
            if [[ "$CARGO_PACKAGE" == protoc-gen-* || "$CARGO_PACKAGE" == sqlc-gen-sqlx ]]; then
              "$prefix/$binary" < /dev/null > "$RUNNER_TEMP/smoke.out"
            else
              "$prefix/$binary" --help > "$RUNNER_TEMP/smoke.out"
            fi
            test -s "$RUNNER_TEMP/smoke.out"
          done
          cmp "$RUNNER_TEMP/binstall/$binary" "$RUNNER_TEMP/mise/$binary"

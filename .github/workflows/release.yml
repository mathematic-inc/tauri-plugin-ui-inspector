name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag ${GITHUB_REF_NAME} is not vX.Y.Z or vX.Y.Z-prerelease" >&2
            exit 1
          fi

          mapfile -t versions < <(
            cargo metadata --format-version 1 --no-deps |
              jq -r '.packages[] | select(.name == "tauri-ui-inspector-core" or .name == "tauri-plugin-ui-inspector" or .name == "tauri-ui-inspector") | .version'
            for manifest in packages/*/package.json; do
              jq -r '.version' "$manifest"
            done
          )
          for manifest_version in "${versions[@]}"; do
            if [[ "$manifest_version" != "$version" ]]; then
              echo "tag version $version does not match manifest version $manifest_version" >&2
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          cache: "false"
      - run: pnpm install --frozen-lockfile
      - run: cargo test --locked --workspace --all-features
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  publish-crates:
    name: Publish crates.io packages
    needs: [meta, verify]
    if: needs.meta.outputs.version != '0.1.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          cache: "false"
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crates in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail

          publish() {
            local package="$1"
            if curl -fsS "https://crates.io/api/v1/crates/${package}/${VERSION}" >/dev/null; then
              echo "$package $VERSION is already published"
            else
              cargo publish --locked -p "$package"
            fi
          }

          publish tauri-ui-inspector-core
          for _ in {1..30}; do
            curl -fsS "https://crates.io/api/v1/crates/tauri-ui-inspector-core/${VERSION}" >/dev/null && break
            sleep 10
          done
          publish tauri-plugin-ui-inspector
          publish tauri-ui-inspector

  publish-npm:
    name: Publish npm packages
    needs: [meta, verify]
    if: needs.meta.outputs.version != '0.1.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack and publish in dependency order
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org
          mkdir -p artifacts

          publish() {
            local package="$1"
            local leaf="${package#@tauri-ui-inspector/}"
            if npm view "${package}@${VERSION}" version >/dev/null 2>&1; then
              echo "$package $VERSION is already published"
              return
            fi
            pnpm --filter "$package" pack --pack-destination "$PWD/artifacts"
            npm publish "artifacts/tauri-ui-inspector-${leaf}-${VERSION}.tgz" --access public
          }

          publish @tauri-ui-inspector/shared
          publish @tauri-ui-inspector/inspector
          publish @tauri-ui-inspector/adapter-svelte
          publish @tauri-ui-inspector/adapter-react
          publish @tauri-ui-inspector/adapter-vue

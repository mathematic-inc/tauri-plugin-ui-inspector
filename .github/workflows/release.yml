name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: false
      - name: Validate tag and manifest versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag ${GITHUB_REF_NAME} is not vX.Y.Z or vX.Y.Z-prerelease" >&2
            exit 1
          fi

          mapfile -t versions < <(
            cargo metadata --format-version 1 --no-deps |
              jq -r '.packages[] | select(.name == "tauri-ui-inspector-core" or .name == "tauri-plugin-ui-inspector" or .name == "tauri-ui-inspector") | .version'
            for manifest in packages/*/package.json; do
              jq -r '.version' "$manifest"
            done
          )
          for manifest_version in "${versions[@]}"; do
            if [[ "$manifest_version" != "$version" ]]; then
              echo "tag version $version does not match manifest version $manifest_version" >&2
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify-release:
    name: Verify release
    needs:
      - validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        uses: $/.github/actions/install-build-tools
        with:
          cache: "false"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Rust tests
        run: cargo test --locked --workspace --all-features
      - name: Check packages
        run: pnpm check
      - name: Run package tests
        run: pnpm test
      - name: Build packages
        run: pnpm build

  build-prebuilt-binaries:
    name: Build prebuilt binaries
    needs:
      - validate-release
      - verify-release
    permissions:
      contents: read
    uses: $/.github/workflows/prebuilt.yml

  publish-binaries:
    name: Publish native CLI archives
    needs:
      - validate-release
      - build-prebuilt-binaries
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download native archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Attest native archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload native release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG"
          fi

  publish-crates:
    name: Publish to crates.io
    needs:
      - validate-release
      - verify-release
      - publish-binaries
    if: needs.validate-release.outputs.version != '0.1.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        uses: $/.github/actions/install-build-tools
        with:
          cache: "false"
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish crates in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail

          publish() {
            local package="$1"
            if curl -fsS -A "tauri-plugin-ui-inspector release workflow" "https://crates.io/api/v1/crates/${package}/${VERSION}" >/dev/null; then
              echo "$package $VERSION is already published"
            else
              cargo publish --locked -p "$package"
            fi
          }

          publish tauri-ui-inspector-core
          for _ in {1..30}; do
            curl -fsS -A "tauri-plugin-ui-inspector release workflow" "https://crates.io/api/v1/crates/tauri-ui-inspector-core/${VERSION}" >/dev/null && break
            sleep 10
          done
          publish tauri-plugin-ui-inspector
          publish tauri-ui-inspector

  publish-npm:
    name: Publish to npm
    needs:
      - validate-release
      - verify-release
      - publish-binaries
    if: needs.validate-release.outputs.version != '0.1.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm --workspace-concurrency=1 --filter './packages/*' build
      - name: Pack and publish in dependency order
        shell: bash
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org
          mkdir -p artifacts

          publish() {
            local package="$1"
            local leaf="${package#@tauri-ui-inspector/}"
            if npm view "${package}@${VERSION}" version >/dev/null 2>&1; then
              echo "$package $VERSION is already published"
              return
            fi
            pnpm --filter "$package" pack --pack-destination "$PWD/artifacts"
            npm publish "./artifacts/tauri-ui-inspector-${leaf}-${VERSION}.tgz" --access public
          }

          publish @tauri-ui-inspector/shared
          publish @tauri-ui-inspector/inspector
          publish @tauri-ui-inspector/adapter-svelte
          publish @tauri-ui-inspector/adapter-react
          publish @tauri-ui-inspector/adapter-vue

  verify-install:
    name: Verify published installations
    needs:
      - publish-crates
      - publish-binaries
    permissions:
      contents: read
    uses: $/.github/workflows/verify-published-installations.yml

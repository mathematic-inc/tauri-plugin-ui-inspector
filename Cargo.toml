[workspace]
resolver = "3"
members = [
  "crates/ui-inspector",
  "crates/ui-inspector-core",
  "crates/ui-inspector-plugin",
  "examples/svelte-tauri/src-tauri",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/mathematic-inc/tauri-plugin-ui-inspector"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
fs4 = "1.1.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
interprocess = "2.4.3"
jiff = "0.2.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = "2.11.5"
tauri-plugin = { version = "2.6.3", features = ["build"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
ts-rs = "12.0.1"
ulid = "3.0.0"
xcap = "0.9.8"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
unreachable_pub = "warn"

# These are unmaintained transitive crates required by Tauri's Linux webview
# stack. None is a vulnerability, and no compatible upgrade is available.
[advisories]
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, via Tauri's macro crates" },
  { id = "RUSTSEC-2024-0411", reason = "Tauri requires GTK3 on Linux" },
  { id = "RUSTSEC-2024-0412", reason = "Tauri requires GTK3 on Linux" },
  { id = "RUSTSEC-2024-0413", reason = "Tauri requires GTK3 on Linux" },
  { id = "RUSTSEC-2024-0414", reason = "Tauri requires GTK3 on Linux" },
  { id = "RUSTSEC-2024-0415", reason = "Tauri requires GTK3 on Linux" },
  { id = "RUSTSEC-2024-0416", reason = "Tauri requires GTK3 on Linux" },
  { id = "RUSTSEC-2024-0417", reason = "Tauri requires GTK3 on Linux" },
  { id = "RUSTSEC-2024-0418", reason = "Tauri requires GTK3 on Linux" },
  { id = "RUSTSEC-2024-0419", reason = "Tauri requires GTK3 on Linux" },
  { id = "RUSTSEC-2024-0420", reason = "Tauri requires GTK3 on Linux" },
  { id = "RUSTSEC-2025-0075", reason = "unic-*, via Tauri's urlpattern dependency" },
  { id = "RUSTSEC-2025-0080", reason = "unic-*, via Tauri's urlpattern dependency" },
  { id = "RUSTSEC-2025-0081", reason = "unic-*, via Tauri's urlpattern dependency" },
  { id = "RUSTSEC-2025-0098", reason = "unic-*, via Tauri's urlpattern dependency" },
  { id = "RUSTSEC-2025-0100", reason = "unic-*, via Tauri's urlpattern dependency" },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "CC0-1.0",
  "MIT",
  "MIT-0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[package]
name = "ui-inspector-svelte-example"
version = "0.0.3"
edition.workspace = true
rust-version.workspace = true
description = "Native fixture application for tauri-plugin-ui-inspector."
license.workspace = true
publish = false

[dependencies]
tauri = { workspace = true, features = [] }
tauri-plugin-ui-inspector = { path = "../../../crates/ui-inspector-plugin", version = "0.1.2" }
# Compiled for its ACL manifest; registered only by the `e2e` feature.
tauri-plugin-wdio = "1.3.0"
# Exposes a local WebDriver only in the explicit `e2e` feature.
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[lints]
workspace = true
